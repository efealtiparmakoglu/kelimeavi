<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelime Avcısı — çevrimdışı</title>
<style>
  :root { color-scheme: dark; }
  body {
    font-family: ui-monospace, monospace;
    background: #101418; color: #d7dde3;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px; margin: 0; gap: 12px;
  }
  h1 { font-size: 18px; margin: 0; }
  #board { display: grid; grid-template-rows: repeat(6, 44px); gap: 5px; }
  #board .cell {
    width: 44px; height: 44px; border: 2px solid #2c343c;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: bold; text-transform: uppercase;
  }
  .correct { background: #2e7d32; border-color: #2e7d32 !important; color: white; }
  .present { background: #b98900; border-color: #b98900 !important; color: white; }
  .absent { background: #333; border-color: #333 !important; color: #777; }
  #keyboard { display: flex; flex-direction: column; gap: 4px; }
  .kb-row { display: flex; gap: 4px; justify-content: center; }
  .key {
    min-width: 30px; height: 40px; padding: 0 6px;
    border: 1px solid #2c343c; background: #1b2129; color: #d7dde3;
    font: inherit; font-size: 13px; cursor: pointer;
  }
  .key.correct { background: #2e7d32; color: white; }
  .key.present { background: #b98900; color: white; }
  .key.absent { background: #333; color: #666; }
  #status { min-height: 20px; }
  #status.flash { color: #ffd166; }
  .controls { display: flex; gap: 8px; }
  .controls button {
    font: inherit; background: #1b2129; color: #d7dde3;
    border: 1px solid #2c343c; padding: 5px 10px; cursor: pointer;
  }
  #stats { font-size: 13px; color: #9aa5af; }
</style>
</head>
<body>
  <h1>Kelime Avcısı <small>(çevrimdışı)</small></h1>
  <div id="status"></div>
  <div id="board"></div>
  <div id="keyboard"></div>
  <div class="controls">
    <button id="daily">günün oyunu</button>
    <button id="new-game">yeni oyun</button>
  </div>
  <div id="stats"></div>
<script>
window.addEventListener("error", (e) => {
  document.body.dataset.jserror = e.message || "unknown";
});
window.addEventListener("unhandledrejection", (e) => {
  document.body.dataset.jsrejection = String(e.reason).slice(0, 200);
});
</script>

<script type="module">
// core.ts
/* Pure game logic: evaluation with duplicate-letter correctness, daily
 * word selection by local date, statistics. No DOM here. */

                                                       

export const WORD_LEN = 5;
export const MAX_GUESSES = 6;

/** The answer list: hand-picked common Turkish five-letter words. */
export const ANSWERS                    = [
  "kitap", "kalem", "masa", "elma", "armut", "kapak", "çicek", "balık",
  "ekmek", "sütlaç", "kavun", "karpuz", "kiraz", "erik", "muz",
  "deniz", "dalga", "kumsal", "fener", "gemi", "yelken", "liman",
  "orman", "ağaç", "yaprak", "kök", "çiçek", "bahçe", "toprak", "taş",
  "evren", "yıldız", "güneş", "ay", "bulut", "yağmur", "rüzgar", "fırtına",
  "kitaplık", "kütüphane", "defter", "kalemlik", "silgi", "çanta",
  "okul", "sınıf", "öğretmen", "öğrenci", "ders", "sınav", "karnem",
  "aile", "anne", "baba", "kardeş", "dede", "nine", "arkadaş", "komşu",
  "sevgi", "gülümse", "mutluluk", "huzur", "umut", "hayal", "dilek",
  "yolcu", "bilet", "tren", "otobüs", "uçak", "bisiklet", "araba",
  "mutfak", "banyo", "yatak", "salon", "balkon", "merdiven", "kapı",
  "kışlık", "yazlık", "bahar", "sonbahar", "kış", "yaz",
  "peynir", "zeytin", "çaydanlık", "bardak", "tabak", "kaşık", "çatal", "bıçak",
  "bal", "reçel", "tereyağı", "yoğurt", "çorba", "pilav", "kebap", "baklava",
  "şehir", "köy", "kasaba", "sokak", "cadde", "meydan", "park", "köprü",
  "dağ", "tepe", "vadi", "nehir", "göl", "şelale", "kaynak", "pınar",
];

/** Extra words accepted as guesses (not answers). */
export const EXTRA_VALID                    = [
  "kale", "masa", "kelebek", "araba", "satır", "sesli", "izlem", "oyun",
  "tenis", "koşu", "yüzmek", "kazmak", "esnemek", "gülmek", "ağlamak",
  "masal", "öykü", "roman", "şiir", "şarkı", "müzik", "dans", "ritim",
];

export const VALID_WORDS                      = new Set(
  [...ANSWERS, ...EXTRA_VALID].map((w) => w.toLowerCase()),
);

function normalize(word        )         {
  return word.toLocaleLowerCase("tr").trim();
}

/** Wordle-style evaluation with correct duplicate-letter handling. */
export function evaluate(guess        , answer        )            {
  const guessNorm = normalize(guess);
  const answerNorm = normalize(answer);
  if (guessNorm.length !== WORD_LEN || answerNorm.length !== WORD_LEN) {
    throw new Error("both words must be 5 letters");
  }
  const verdicts            = new Array(WORD_LEN).fill("absent");
  const remaining                         = {};

  for (let i = 0; i < WORD_LEN; i++) {
    if (guessNorm[i] === answerNorm[i]) {
      verdicts[i] = "correct";
    } else {
      remaining[answerNorm[i]          ] = (remaining[answerNorm[i]          ] ?? 0) + 1;
    }
  }
  for (let i = 0; i < WORD_LEN; i++) {
    if (verdicts[i] === "correct") continue;
    const letter = guessNorm[i]          ;
    if ((remaining[letter] ?? 0) > 0) {
      verdicts[i] = "present";
      remaining[letter] = (remaining[letter]          ) - 1;
    }
  }
  return verdicts;
}

export function isValidWord(word        )          {
  return VALID_WORDS.has(normalize(word));
}

export function isWin(verdicts           )          {
  return verdicts.every((v) => v === "correct");
}

/** Deterministic daily index from the LOCAL date string, e.g. 2026-09-24.
 * Same day (local time) -> same word everywhere on this machine. */
export function dailyIndex(dateStr        , listLength        )         {
  let hash = 5381;
  for (const ch of dateStr) {
    hash = ((hash * 33) ^ ch.codePointAt(0) ) >>> 0;
  }
  return hash % listLength;
}

export function todayLocalDateString(now       = new Date())         {
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

export function dailyWord(now       = new Date())         {
  return ANSWERS[dailyIndex(todayLocalDateString(now), ANSWERS.length)]          ;
}

/** Merge a guess's verdicts into the keyboard letter state:
 * correct beats present beats absent; never downgrade. */
                                                                   

export function mergeKeyState(current                          , guess        , verdicts           )                           {
  const rank                           = { unused: 0, absent: 1, present: 2, correct: 3 };
  const out = { ...current };
  for (let i = 0; i < guess.length; i++) {
    const letter = normalize(guess[i]);
    const verdict = verdicts[i];
    const existing = (out[letter] ?? "unused")            ;
    if (rank[verdict] > rank[existing]) {
      out[letter] = verdict;
    }
  }
  return out;
}

                        
                 
               
                        
                    
 

export function emptyStats()        {
  return { played: 0, wins: 0, currentStreak: 0, maxStreak: 0 };
}

/** Update stats after a finished game. */
export function applyResult(stats       , won         )        {
  const next        = {
    played: stats.played + 1,
    wins: stats.wins + (won ? 1 : 0),
    currentStreak: won ? stats.currentStreak + 1 : 0,
    maxStreak: Math.max(stats.maxStreak, won ? stats.currentStreak + 1 : stats.currentStreak),
  };
  return next;
}

/* DOM layer: grid, on-screen keyboard with letter states, stats panel,
 * daily mode (local date), dark-ish styling. */

// core.ts (inlined below)

const STORAGE = "kelimeavi-state";

                 
                 
                    
               
               
 

function load()        {
  try {
    const raw = localStorage.getItem(STORAGE);
    if (raw) {
      const saved = JSON.parse(raw)         ;
      if (saved.date === todayLocalDateString() && saved.answer) return saved;
    }
  } catch {
    /* fall through to a fresh game */
  }
  const answer = dailyWord();
  return { answer, guesses: [], date: todayLocalDateString(), stats: emptyStats() };
}

let saved        = load();
let keyState                           = {};
let current = "";
let finished = false;

function persist()       {
  try {
    localStorage.setItem(STORAGE, JSON.stringify(saved));
  } catch {
    /* storage unavailable: session-only play */
  }
}

function buildBoard()       {
  const boardEl = document.getElementById("board")               ;
  boardEl.innerHTML = "";
  for (let r = 0; r < MAX_GUESSES; r++) {
    for (let c = 0; c < WORD_LEN; c++) {
      const cellEl = document.createElement("div");
      cellEl.className = "cell";
      cellEl.dataset.row = String(r);
      cellEl.dataset.col = String(c);
      boardEl.appendChild(cellEl);
    }
  }
  buildKeyboard();
}

function buildKeyboard()       {
  const kb = document.getElementById("keyboard")               ;
  kb.innerHTML = "";
  const rows = ["euıoüpa", "rtyşghjkl", "zcvbnmöqwx", "⏎"];
  for (const row of rows) {
    const rowEl = document.createElement("div");
    rowEl.className = "kb-row";
    for (const letter of row) {
      if (letter === "⏎") {
        rowEl.appendChild(keyButton("⏎", "Enter"));
        rowEl.appendChild(keyButton("←", "Backspace"));
        continue;
      }
      rowEl.appendChild(keyButton(letter.toUpperCase(), letter));
    }
    kb.appendChild(rowEl);
  }
}

function keyButton(label        , key        )                    {
  const button = document.createElement("button");
  button.className = "key";
  button.textContent = label;
  button.dataset.key = key;
  button.addEventListener("click", () => handleKey(key));
  return button;
}

function handleKey(key        )       {
  if (finished) return;
  if (key === "Enter") {
    submit();
  } else if (key === "Backspace") {
    current = current.slice(0, -1);
  } else if (/^[a-zçğıöşü]$/.test(key) && current.length < WORD_LEN) {
    current += key;
  }
  paintCurrent();
}

function paintCurrent()       {
  const row = saved.guesses.length;
  for (let c = 0; c < WORD_LEN; c++) {
    const cellEl = document.querySelector                (
      `#board .cell[data-row="${row}"][data-col="${c}"]`,
    );
    if (cellEl) cellEl.textContent = (current[c] ?? "").toLocaleUpperCase("tr");
  }
}

function submit()       {
  if (current.length !== WORD_LEN) {
    flash("5 harf gir");
    return;
  }
  if (!isValidWord(current)) {
    flash("kelime listede yok");
    return;
  }
  const verdicts            = evaluate(current, saved.answer);
  const row = saved.guesses.length;
  for (let c = 0; c < WORD_LEN; c++) {
    const cellEl = document.querySelector                (
      `#board .cell[data-row="${row}"][data-col="${c}"]`,
    );
    if (!cellEl) continue;
    cellEl.classList.add(verdicts[c]          );
  }
  saved.guesses.push(current);
  keyState = mergeKeyState(keyState, current, verdicts);
  paintKeyboard();

  if (isWin(verdicts)) {
    finished = true;
    saved.stats = applyResult(saved.stats, true);
    persist();
    flash(`TEBRİKLER! ${saved.guesses.length}/6`);
    return;
  }
  if (saved.guesses.length >= MAX_GUESSES) {
    finished = true;
    saved.stats = applyResult(saved.stats, false);
    persist();
    flash(`kelime: ${saved.answer.toLocaleUpperCase("tr")}`);
    return;
  }
  persist();
  current = "";
  paintCurrent();
}

function paintKeyboard()       {
  document.querySelectorAll                   ("#keyboard .key").forEach((button) => {
    const key = button.dataset.key;
    if (key && keyState[key]) {
      button.classList.remove("correct", "present", "absent");
      button.classList.add(keyState[key]          );
    }
  });
}

function paintStats()       {
  const el = document.getElementById("stats")               ;
  const stats        = saved.stats ?? emptyStats();
  const rate = stats.played ? Math.round((stats.wins / stats.played) * 100) : 0;
  el.textContent = `oynanan ${stats.played} · kazanma %${rate} · seri ${stats.currentStreak} (en iyi ${stats.maxStreak})`;
}

function flash(message        )       {
  paintStats();
  const el = document.getElementById("status")               ;
  el.textContent = message;
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 1200);
}

function newGame()       {
  saved = { answer: dailyWord(), guesses: [], date: todayLocalDateString(), stats: saved.stats };
  keyState = {};
  current = "";
  finished = false;
  buildBoard();
  paintStats();
  persist();
}

function setup()       {
  buildBoard();
  paintStats();
  document.getElementById("new-game")?.addEventListener("click", newGame);
  document.getElementById("daily")?.addEventListener("click", () => {
    saved = load();
    keyState = {};
    current = "";
    finished = saved.guesses.length >= MAX_GUESSES || saved.guesses.includes(saved.answer);
    buildBoard();
    replaySaved();
    paintStats();
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Enter") handleKey("Enter");
    else if (event.key === "Backspace") handleKey("Backspace");
    else handleKey(event.key.toLocaleLowerCase("tr"));
  });
  // restore today's guesses from the save
  finished = saved.guesses.includes(saved.answer) || saved.guesses.length >= MAX_GUESSES;
  for (const guess of saved.guesses) {
    const verdicts            = evaluate(guess, saved.answer);
    const row = saved.guesses.indexOf(guess);
    for (let c = 0; c < WORD_LEN; c++) {
      const cellEl = document.querySelector                (
        `#board .cell[data-row="${row}"][data-col="${c}"]`,
      );
      if (cellEl) {
        cellEl.textContent = guess.toLocaleUpperCase("tr")[c] ?? "";
        cellEl.classList.add(verdicts[c]          );
      }
    }
    keyState = mergeKeyState(keyState, guess, verdicts);
  }
  paintKeyboard();
  paintStats();
}

function replaySaved()       {
  for (const guess of saved.guesses) {
    const verdicts            = evaluate(guess, saved.answer);
    const row = saved.guesses.indexOf(guess);
    for (let c = 0; c < WORD_LEN; c++) {
      const cellEl = document.querySelector                (
        `#board .cell[data-row="${row}"][data-col="${c}"]`,
      );
      if (cellEl) {
        cellEl.textContent = guess.toLocaleUpperCase("tr")[c] ?? "";
        cellEl.classList.add(verdicts[c]          );
      }
    }
    keyState = mergeKeyState(keyState, guess, verdicts);
  }
  paintKeyboard();
}

void ANSWERS;

try {
  setup();
} catch (error) {
  document.body.dataset.error = String(error);
}
if (typeof document !== "undefined") {
  document.body.dataset.qa =
    `cells=${document.querySelectorAll("#board .cell").length}` +
    ` keys=${document.querySelectorAll("#keyboard .key").length}`;
}

</script>
</body>
</html>
